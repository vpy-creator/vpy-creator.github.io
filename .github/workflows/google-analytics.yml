name: Google Analytics trên mọi trang
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gan-ga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gắn thẻ vào trang còn thiếu
        run: bash tools/kiem-ga.sh --gan
      - name: Commit nếu có trang vừa được gắn
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Tự gắn Google Analytics cho trang mới"
            git push
          fi
